appId: com.mnzonex.gamedownloader
productName: MN Game Downloader
directories:
  output: release
files:
  - dist/**/*
  - main.cjs
  - package.json
  - icon.ico
  - icon.png
extraResources:
  - from: dist/server.cjs
    to: dist/server.cjs
win:
  target: nsis
  icon: icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "MN Game Downloader"
publish:
  provider: github
  owner: mnzonex
  repo: MN-Game-Downloader
  private: true

