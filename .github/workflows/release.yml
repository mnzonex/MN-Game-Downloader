name: Build and Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python for the native download engine
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: engine-requirements.txt

      - name: Install Python engine dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r engine-requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Build the native engine
        run: npm run engine:build

      - name: Run automated regression tests
        run: npm test

      - name: Build the application and publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run build && npx electron-builder --win nsis --publish always