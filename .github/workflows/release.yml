name: Build and Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/release.yml'
      - 'main.cjs'
      - 'preload.cjs'
      - 'server.ts'
      - 'analytics-core.cjs'
      - 'posthog-config.cjs'
      - 'src/**'
      - 'tests/**'
      - 'engine.py'
      - 'engine.spec'
      - 'engine-requirements.txt'
      - 'electron-builder.yml'
      - 'PRIVACY.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python for the native download engine
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: engine-requirements.txt

      - name: Install Python engine dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r engine-requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Build the native engine
        run: npm run engine:build

      - name: Run automated regression tests
        run: npm test

      - name: Verify offline PostHog queue persistence
        run: npm run test:offline-queue

      - name: Ensure the version tag exists before publishing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $existing = git ls-remote --tags origin "refs/tags/$tag"
          if (-not $existing) {
            git tag $tag $env:GITHUB_SHA
            git push origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "Failed to push release tag $tag" }
            Write-Host "Created immutable release tag $tag at $env:GITHUB_SHA"
          } else {
            Write-Host "Release tag $tag already exists; keeping the existing immutable tag."
          }
      - name: Build the application and publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run build && npx electron-builder --win nsis --publish always
      - name: Publish the release for the in-app updater
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; 'X-GitHub-Api-Version' = '2022-11-28'; 'User-Agent' = 'MN-Game-Downloader' }
          $releases = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases?per_page=100" -Headers $headers
          $release = $releases | Where-Object { $_.tag_name -eq $tag } | Sort-Object created_at -Descending | Select-Object -First 1
          if (-not $release) { throw "electron-builder did not create a release draft for $tag" }
          $payload = @{ draft = $false; prerelease = $false; make_latest = 'true'; name = "MN Game Downloader $version"; body = "Windows installer built on GitHub Actions. Regression tests and the offline analytics queue smoke test passed." } | ConvertTo-Json
          $published = Invoke-RestMethod -Method Patch -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/$($release.id)" -Headers $headers -ContentType 'application/json' -Body $payload
          if ($published.draft -or -not $published.published_at) { throw "GitHub did not publish $tag" }
          Write-Host "Published $tag at $($published.html_url)"